<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema de Gestão APS</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body class="pagina-login">

    <main class="login-container">

        <section class="login-card">

            <div class="login-cabecalho">

                <div class="login-icone">
                    🏥
                </div>

                <h1>Sistema de Gestão da Atenção Primária</h1>

                <p>
                    Acesso ao sistema
                </p>

            </div>


            <form id="formLogin">

                <div class="campo">

                    <label for="usuario">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Digite seu usuário"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="botao-login"
                >
                    Entrar
                </button>


                <a
                    href="../index.html"
                    class="voltar"
                >
                    Voltar para página inicial
                </a>

            </form>

        </section>

    </main>


    <script src="../js/script.js"></script>

</body>

</html>
